<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>تسجيل الموظفين - جيل الإبداع</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
<style>
body { font-family: 'Tajawal', sans-serif; background: #f4f7f6; padding: 20px; direction: rtl; }
.card { max-width: 500px; margin: auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
input, select { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box; }
.btn { width: 100%; padding: 15px; background: #2c3e50; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
</style>
</head>
<body>
<div class="card">
<h2>تسجيل موظف جديد 👨‍🏫</h2>
<form id="staffForm">
<input type="text" id="staffName" placeholder="اسم الموظف الرباعي" required>
<input type="number" id="staffID" placeholder="رقم الهوية" required>
<input type="text" id="jobTitle" placeholder="المسمى الوظيفي (معلم، إداري، حارس...)" required>
<input type="number" id="salary" placeholder="الراتب الأساسي" required>
<input type="date" id="joinDate" required title="تاريخ المباشرة">
<button type="submit" class="btn" id="saveBtn">حفظ بيانات الموظف</button>
</form>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = { /* ضع إعدادات مشروعك هنا */ };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

document.getElementById('staffForm').addEventListener('submit', async (e) => {
e.preventDefault();
const btn = document.getElementById('saveBtn');
btn.disabled = true;
try {
await addDoc(collection(db, "staff"), {
name: document.getElementById('staffName').value,
idNumber: document.getElementById('staffID').value,
title: document.getElementById('jobTitle').value,
salary: document.getElementById('salary').value,
joinDate: document.getElementById('joinDate').value,
timestamp: serverTimestamp()
});
alert("تم تسجيل الموظف بنجاح");
location.reload();
} catch (error) { alert("خطأ في الحفظ"); btn.disabled = false; }
});
</script>
</body>
</html>
