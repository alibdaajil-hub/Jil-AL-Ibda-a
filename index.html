<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مدرسة جيل الإبداع - الرئيسية</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root {
--primary: #000000; /* اللون الأسود */
--gold: #D4AF37; /* اللون الذهبي */
--bg: #ffffff; /* خلفية بيضاء */
}

body {
font-family: 'Tajawal', sans-serif;
background: var(--bg);
margin: 0;
display: flex;
flex-direction: column;
align-items: center;
min-height: 100vh;
overflow-x: hidden;
}

/* قسم الهيدر الملكي */
.header-section {
width: 100%;
padding: 60px 0 20px;
background: white;
display: flex;
flex-direction: column;
align-items: center;
text-align: center;
}

.logo-img {
width: 120px;
height: auto;
margin-bottom: 20px;
filter: drop-shadow(0 5px 10px rgba(0,0,0,0.1));
}

/* تصميم اسم المدرسة بالأسود والذهبي */
.school-name-container {
position: relative;
perspective: 1000px;
}

.school-name {
font-size: 3rem;
font-weight: 900;
color: var(--primary);
margin: 0;
padding: 0 10px;
/* أطراف ذهبية */
text-shadow:
-1px -1px 0 var(--gold),
1px -1px 0 var(--gold),
-1px 1px 0 var(--gold),
1px 1px 0 var(--gold),
2px 2px 5px rgba(0,0,0,0.2);
letter-spacing: 2px;
}

/* تأثير الانعكاس المائي */
.reflection {
font-size: 3rem;
font-weight: 900;
margin-top: -15px;
color: var(--primary);
text-shadow:
-1px -1px 0 var(--gold),
1px -1px 0 var(--gold),
-1px 1px 0 var(--gold),
1px 1px 0 var(--gold);
transform: scaleY(-1); /* قلب النص */
mask-image: linear-gradient(to bottom, rgba(0,0,0,0) 10%, rgba(0,0,0,0.4) 100%);
-webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,0) 10%, rgba(0,0,0,0.4) 100%);
opacity: 0.3;
user-select: none;
}

/* حاوية الأزرار */
.main-container {
width: 90%;
max-width: 500px;
margin-top: 50px;
display: flex;
flex-direction: column;
gap: 20px;
padding-bottom: 50px;
}

.main-btn {
background: white;
text-decoration: none;
display: flex;
align-items: center;
padding: 20px;
border-radius: 15px;
box-shadow: 0 4px 15px rgba(0,0,0,0.08);
transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
border: 1px solid #f1f1f1;
border-left: 5px solid var(--gold);
}

.main-btn:hover {
transform: translateX(-10px);
background: #fafafa;
border-left: 5px solid var(--primary);
}

.icon {
font-size: 2rem;
margin-left: 20px;
background: #fffdf5;
width: 60px;
height: 60px;
display: flex;
align-items: center;
justify-content: center;
border-radius: 50%;
border: 1px solid #eee;
}

.text h3 { margin: 0; color: var(--primary); font-size: 1.2rem; font-weight: 700; }
.text p { margin: 5px 0 0; color: #666; font-size: 0.85rem; }

.admin-link {
margin-bottom: 30px;
color: #ccc;
text-decoration: none;
font-size: 0.8rem;
}
.admin-link:hover { color: var(--gold); }

</style>
</head>
<body>

<div class="header-section">
<img src="logo.png.jpeg" alt="شعار المدرسة" class="logo-img">

<div class="school-name-container">
<h1 class="school-name">مدرسة جيل الإبداع</h1>
<div class="reflection">مدرسة جيل الإبداع</div>
</div>
</div>

<div class="main-container">
<a href="register.html" class="main-btn">
<div class="icon">📝</div>
<div class="text">
<h3>تسجيل طالب جديد</h3>
<p>ابدأ رحلة النجاح مع أطفالكم</p>
</div>
</a>

<a href="search.html" class="main-btn">
<div class="icon">🔍</div>
<div class="text">
<h3>استعلام عن طالب</h3>
<p>متابعة القبول والبيانات المالية</p>
</div>
</a>

<a href="staff_query.html" class="main-btn">
<div class="icon">👨‍🏫</div>
<div class="text">
<h3>بوابة الموظفين</h3>
<p>خدمات المعلمين والكادر الإداري</p>
</div>
</a>

<a href="feedback.html" class="main-btn">
<div class="icon">📥</div>
<div class="text">
<h3>الشكاوى والمقترحات</h3>
<p>صوتكم يهمنا لتطوير مسيرتنا</p>
</div>
</a>
</div>

<a href="login.html" class="admin-link">لوحة التحكم الإدارية</a>

</body>
</html>
