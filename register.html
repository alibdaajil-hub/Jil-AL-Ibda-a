<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل طالب جديد - جيل الإبداع</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root { --primary: #2c3e50; --accent: #27ae60; --bg: #f4f7f6; --error: #c0392b; }
body { font-family: 'Tajawal', sans-serif; background: var(--bg); display: flex; justify-content: center; padding: 20px; }

.register-card { width: 100%; max-width: 500px; background: white; padding: 30px; border-radius: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border-top: 8px solid var(--accent); }
h2 { text-align: center; color: var(--primary); margin-bottom: 25px; }

.form-group { margin-bottom: 15px; }
label { display: block; margin-bottom: 8px; font-weight: bold; color: var(--primary); }
input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 12px; font-family: 'Tajawal'; font-size: 1rem; box-sizing: border-box; }

.btn-submit { width: 100%; padding: 15px; background: var(--accent); color: white; border: none; border-radius: 12px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
.btn-submit:disabled { background: #ccc; cursor: not-allowed; }

/* تصميم نافذة التنبيه للتكرار */
.error-popup { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 9999; display: none; justify-content: center; align-items: center; }
.error-box { background: white; padding: 30px; border-radius: 20px; text-align: center; max-width: 400px; width: 90%; border-top: 8px solid var(--error); animation: slideDown 0.3s ease; }
@keyframes slideDown { from { transform: translateY(-50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

.btn-go-search { background: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 10px; cursor: pointer; font-family: 'Tajawal'; font-weight: bold; margin-top: 15px; }
.back-link { display: block; text-align: center; margin-top: 20px; color: #7f8c8d; text-decoration: none; }
</style>
</head>
<body>

<div class="error-popup" id="duplicatePopup">
<div class="error-box">
<h3 style="color: var(--error);">عفواً.. الطالب مسجل مسبقاً! ⚠️</h3>
<p>لقد وجدنا أن رقم الهوية/الحدود هذا مرتبط بطالب مسجل لدينا بالفعل. يمكنك الاستعلام عن حالته مباشرة.</p>
<button class="btn-go-search" onclick="window.location.href='search.html'">الذهاب لقسم الاستعلام 🔍</button>
<button onclick="closeError()" style="background:none; border:none; color:#999; cursor:pointer; display:block; margin: 15px auto 0;">إغلاق</button>
</div>
</div>

<div class="register-card">
<h2>استمارة تسجيل طالب 📝</h2>
<form id="registrationForm">
<div class="form-group">
<label>اسم الطالب الرباعي</label>
<input type="text" id="studentName" required placeholder="أدخل الاسم كاملاً">
</div>

<div class="form-group">
<label>رقم الهوية أو الحدود (10 أرقام)</label>
<input type="number" id="nationalID" required placeholder="رقم الهوية هو مفتاح التسجيل">
</div>

<div class="form-group">
<label>المرحلة الدراسية</label>
<select id="currentGrade" required>
<option value="">اختر المرحلة...</option>
<option value="تمهيدي">تمهيدي</option>
<option value="ابتدائي">ابتدائي</option>
<option value="متوسط">متوسط</option>
</select>
</div>

<div class="form-group">
<label>رقم جوال ولي الأمر</label>
<input type="tel" id="parentPhone" required placeholder="05xxxxxxxx">
</div>

<button type="submit" class="btn-submit" id="submitBtn">إرسال طلب التسجيل</button>
<a href="index.html" class="back-link">العودة للرئيسية</a>
</form>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, query, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyDuotSqXkOwPrWIAxNC7KCqWlyYonsUIBA",
authDomain: "jil-al-ibda-a.firebaseapp.com",
projectId: "jil-al-ibda-a",
storageBucket: "jil-al-ibda-a.firebasestorage.app",
messagingSenderId: "1057703586286",
appId: "1:1057703586286:web:e581aa576eef32930746ff"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.closeError = () => { document.getElementById('duplicatePopup').style.display = 'none'; };

document.getElementById('registrationForm').addEventListener('submit', async (e) => {
e.preventDefault();

const nID = document.getElementById('nationalID').value.trim();
const sName = document.getElementById('studentName').value.trim();
const sGrade = document.getElementById('currentGrade').value;
const pPhone = document.getElementById('parentPhone').value.trim();
const btn = document.getElementById('submitBtn');

btn.disabled = true;
btn.innerText = "جاري التحقق من السجلات...";

try {
// الخطوة الأهم: فحص التكرار بناءً على رقم الهوية
const q = query(collection(db, "students"), where("nationalID", "==", nID));
const querySnapshot = await getDocs(q);

if (!querySnapshot.empty) {
// إذا وجدنا الطالب، أظهر النافذة المنبثقة
document.getElementById('duplicatePopup').style.display = 'flex';
btn.disabled = false;
btn.innerText = "إرسال طلب التسجيل";
return;
}

// إذا لم يكن مسجلاً، قم بالحفظ
await addDoc(collection(db, "students"), {
studentName: sName,
nationalID: nID,
class: sGrade,
parentPhone: pPhone,
paymentStatus: "غير مسدد",
timestamp: serverTimestamp()
});

alert("تم تسجيل الطالب بنجاح! سيتم توجيهك للرئيسية.");
window.location.href = "index.html";

} catch (error) {
console.error(error);
alert("حدث خطأ تقني، يرجى المحاولة لاحقاً.");
btn.disabled = false;
btn.innerText = "إرسال طلب التسجيل";
}
});
</script>

</body>
</html>
