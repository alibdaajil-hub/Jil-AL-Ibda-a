<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>استعلام الموظفين</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
<style>
body { font-family: 'Tajawal', sans-serif; background: #eceff1; padding: 20px; text-align: center; }
.query-box { max-width: 400px; margin: auto; background: white; padding: 20px; border-radius: 12px; }
.result-card { display: none; margin-top: 20px; padding: 15px; background: #fff; border-right: 5px solid #27ae60; text-align: right; }
</style>
</head>
<body>
<div class="query-box">
<h3>استعلام بيانات الموظف 🔍</h3>
<input type="number" id="qID" placeholder="أدخل رقم هويتك" style="width:80%; padding:10px; margin-bottom:10px;">
<button onclick="checkStaff()" id="qBtn" style="padding:10px 20px; cursor:pointer;">استعلام</button>
</div>

<div id="result" class="result-card">
<p><b>الاسم:</b> <span id="resName"></span></p>
<p><b>الوظيفة:</b> <span id="resTitle"></span></p>
<p><b>تاريخ المباشرة:</b> <span id="resDate"></span></p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = { /* ضع إعدادات مشروعك هنا */ };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.checkStaff = async () => {
const id = document.getElementById('qID').value;
const q = query(collection(db, "staff"), where("idNumber", "==", id));
const snap = await getDocs(q);

if(!snap.empty) {
const data = snap.docs[0].data();
document.getElementById('resName').innerText = data.name;
document.getElementById('resTitle').innerText = data.title;
document.getElementById('resDate').innerText = data.joinDate;
document.getElementById('result').style.display = 'block';
} else {
alert("عفواً، لا يوجد موظف مسجل بهذا الرقم");
}
};
</script>
</body>
</html>
