<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل موظف جديد - جيل الإبداع</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root { --primary: #2c3e50; --accent: #27ae60; --bg: #f4f7f6; }
body { font-family: 'Tajawal', sans-serif; background: var(--bg); display: flex; justify-content: center; padding: 20px; margin: 0; }
.card { width: 100%; max-width: 500px; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border-top: 8px solid var(--primary); }
h2 { text-align: center; color: var(--primary); }
.form-group { margin-bottom: 15px; }
label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.9rem; }
input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 10px; font-family: 'Tajawal'; box-sizing: border-box; }
.btn-save { width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 10px; font-size: 1.1rem; font-weight: bold; cursor: pointer; margin-top: 10px; }
.btn-back { display: block; text-align: center; margin-top: 15px; color: #7f8c8d; text-decoration: none; font-size: 0.9rem; }
</style>
</head>
<body>

<div class="card">
<h2>تسجيل موظف جديد 👨‍🏫</h2>
<form id="staffForm">
<div class="form-group">
<label>اسم الموظف الرباعي</label>
<input type="text" id="staffName" required placeholder="أدخل الاسم الكامل">
</div>
<div class="form-group">
<label>رقم الهوية / الإقامة</label>
<input type="number" id="staffID" required placeholder="أدخل رقم الهوية">
</div>
<div class="form-group">
<label>المسمى الوظيفي</label>
<input type="text" id="jobTitle" required placeholder="مثلاً: معلم لغة عربية">
</div>
<div class="form-group">
<label>الراتب الأساسي</label>
<input type="number" id="salary" required placeholder="أدخل الراتب">
</div>
<div class="form-group">
<label>تاريخ المباشرة</label>
<input type="date" id="joinDate" required>
</div>
<button type="submit" class="btn-save" id="saveBtn">حفظ البيانات</button>
<a href="students_section.html" class="btn-back">العودة للوحة التحكم</a>
</form>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyDuotSqXkOwPrWIAxNC7KCqWlyYonsUIBA",
authDomain: "jil-al-ibda-a.firebaseapp.com",
projectId: "jil-al-ibda-a",
storageBucket: "jil-al-ibda-a.firebasestorage.app",
messagingSenderId: "1057703586286",
appId: "1:1057703586286:web:e581aa576eef32930746ff"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

document.getElementById('staffForm').addEventListener('submit', async (e) => {
e.preventDefault();
const btn = document.getElementById('saveBtn');
btn.disabled = true;
btn.innerText = "جاري الحفظ...";

try {
await addDoc(collection(db, "staff"), {
name: document.getElementById('staffName').value,
idNumber: document.getElementById('staffID').value, // يُحفظ كنص/رقم
title: document.getElementById('jobTitle').value,
salary: document.getElementById('salary').value,
joinDate: document.getElementById('joinDate').value,
timestamp: serverTimestamp()
});
alert("تم تسجيل الموظف بنجاح!");
document.getElementById('staffForm').reset();
} catch (error) {
alert("حدث خطأ في الحفظ");
}
btn.disabled = false;
btn.innerText = "حفظ البيانات";
});
</script>
</body>
</html>
