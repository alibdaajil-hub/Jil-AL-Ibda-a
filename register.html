<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>استمارة قبول وتسجيل طالب - مؤسسة جيل الإبداع والتميز</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
--navy: #0f2c59;
--navy-dark: #091c3a;
--navy-light: #e8eef7;
--border: #b8c4d4;
--label-bg: #f4f7fb;
--gold: #D4AF37;
--gold-soft: #fffdf5;
--warn-bg: #fffbeb;
--warn-border: #f59e0b;
--warn-text: #92400e;
--green: #15803d;
--green-bg: #f0fdf4;
}

* { box-sizing: border-box; font-family: 'Tajawal', sans-serif; }

body {
margin: 0;
background: #eef2f6;
color: #1e293b;
padding: 18px 10px 45px;
}

.top-nav {
max-width: 860px;
margin: 0 auto 12px;
display: flex;
justify-content: space-between;
align-items: center;
gap: 10px;
}

.nav-btn {
display: inline-flex;
align-items: center;
gap: 6px;
background: #fff;
color: var(--navy);
text-decoration: none;
font-weight: 700;
padding: 8px 14px;
border-radius: 8px;
border: 1px solid var(--border);
font-size: 0.88rem;
cursor: pointer;
}

.nav-btn:hover { background: var(--navy-light); }

.nav-btn-gold {
background: var(--gold-soft);
border-color: var(--gold);
color: #78350f;
}

.sheet {
max-width: 860px;
margin: 0 auto;
background: #fff;
padding: 24px 26px;
border-radius: 10px;
border: 1px solid #cfd8e3;
border-top: 5px solid var(--gold);
box-shadow: 0 10px 28px rgba(15, 44, 89, 0.1);
}

/* الترويسة بعد حذف التاريخ ورقم التسجيل */
.header-top {
display: flex;
justify-content: space-between;
align-items: center;
gap: 16px;
padding-bottom: 12px;
border-bottom: 1px solid #e2e8f0;
margin-bottom: 12px;
}

.h-right {
font-weight: 700;
color: var(--navy);
font-size: 0.85rem;
line-height: 1.65;
text-align: right;
}

.h-center {
text-align: center;
flex: 1;
}

.h-center h1 {
margin: 0;
font-size: 1.45rem;
color: var(--navy);
font-weight: 900;
}

.h-center .sub {
font-size: 1.08rem;
font-weight: 700;
color: #2b4c7e;
margin: 3px 0;
}

.h-center .stages {
font-size: 0.8rem;
color: #475569;
font-weight: 600;
}

.h-logo img {
max-height: 68px;
width: auto;
object-fit: contain;
}

.banner {
background: linear-gradient(135deg, var(--navy), #1e40af);
color: #fff;
text-align: center;
font-weight: 800;
font-size: 1.04rem;
padding: 9px 12px;
border-radius: 6px;
margin-bottom: 14px;
}

.sec-title {
background: var(--navy-light);
color: var(--navy);
font-weight: 800;
font-size: 0.95rem;
padding: 7px 12px;
border-right: 4px solid var(--navy);
border-radius: 4px;
margin: 14px 0 7px;
}

table.form-tbl {
width: 100%;
border-collapse: collapse;
font-size: 0.89rem;
margin-bottom: 8px;
}
